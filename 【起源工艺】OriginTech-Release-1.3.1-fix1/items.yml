OriginTech_info:
  lateInit: false
  item_group: OriginTech_info
  item:
    name: '&c&l起源工艺 - 介绍'
    lore:
      - '&7这是一个没有什么特色的附属'
      - '&7写这个附属的初衷是创造一些有用的机器，能简化一些材料的生产线'
      - '&7但现在嘛......你可以在其中看到一大堆成分复杂的东西'
      - '&7作者并不怎么会设计一个好的流程，因此你可能会看到一些无厘头的配方，以及一些似乎只是凑数用的材料'
      - '&7总之，希望这个附属能为你的发展提供一些帮助'
      - '&7祝你游戏愉快'
    material_type: mc
    material: PAPER
    amount: 1
  placeable: false
  recipe_type: 'NULL'
OriginTech_info2:
  lateInit: false
  item_group: OriginTech_info
  item:
    name: '&a&l起源工艺 - 版本'
    lore:
      - "&e作者:playerocket"
      - '&7感谢各大使用起源工艺的服务器'
      - '&7感谢其他为本附属提供帮助的附属开发者们'
      - '&7感谢提供反馈的广大玩家'
      - '&7粘液大群:118591355，群内收录有诸多附属，同时有许多开发者和资深粘液玩家，欢迎入群'
      - '&4本附属后期难度极高！强烈建议在毕业逻辑工艺后再推进后期!'
      - "&e- 版本号: Release-1.3.1-fix1"
    material_type: mc
    material: PAPER
    amount: 1
  placeable: false
  recipe_type: 'NULL'
OriginTech_info3:
  lateInit: false
  item_group: OriginTech_info
  item:
    name: '&4&l免责声明'
    lore:
      - "&c起源工艺本地测试服版本为1.21.1"
      - '&71.21.1+的服务器可能会出现部分bug'
      - '&7尽管如此，若你在高版本的服务器中游玩起源工艺时遇到问题，仍可以向作者反馈，作者会尽力解决'
      - '&7出于个人原因，这里不放出作者QQ号，你可以通过在各大粘液群寻找作者，或是直接在github提交issue'
      - '&c作者不对任何修改版本中出现的bug负责'
    material_type: mc
    material: PAPER
    amount: 1
  placeable: false
  recipe_type: 'NULL'
